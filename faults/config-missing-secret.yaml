id: config-missing-secret
runbook: create-container-config-error
description: A secretKeyRef points at a Secret that does not exist.
manifests: |
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: billing, labels: {app: billing}}
  spec:
    replicas: 1
    selector: {matchLabels: {app: billing}}
    template:
      metadata: {labels: {app: billing}}
      spec:
        terminationGracePeriodSeconds: 2
        containers:
          - name: billing
            image: nginx:1.27-alpine
            env:
              - name: DB_PASSWORD
                valueFrom: {secretKeyRef: {name: db-credentials, key: password}}
expect:
  - 'CreateContainerConfigError'
  - 'secret "db-credentials" not found'
