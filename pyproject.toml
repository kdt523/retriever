[project]
name = "runbook-retriever"
version = "0.1.0"
description = "Fine-tuned bge-small embeddings for Kubernetes incident -> runbook retrieval"
readme = "README.md"
authors = [{ name = "Krushna Datir" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training / evaluation stack (Phases 1-5). Kept out of the base install so the
# serving image (Phase 6) never pulls in PyTorch.
ml = [
    "accelerate>=1.1",  # required by the HF Trainer behind SentenceTransformerTrainer
    "datasets>=3.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.4",
    "torch>=2.7",
]
# Local labeling UI for hand-checking the test set (Phase 2e). Not needed to train or serve.
label = [
    "streamlit>=1.57",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runbook_retriever"]

# CUDA build of torch on Windows/Linux (RTX 3050, sm_86). macOS falls back to PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
# SIM905 rewrites readable word lists ("a b c".split()) into one very long list literal.
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed real kubectl output lines verbatim.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "review"]
mypy_path = ["src", "review"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "rank_bm25", "datasets", "datasets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
