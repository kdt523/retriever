id: pending-node-selector
runbook: pending-taints-affinity
description: A nodeSelector asks for a node label that no node has.
manifests: |
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: search, labels: {app: search}}
  spec:
    replicas: 1
    selector: {matchLabels: {app: search}}
    template:
      metadata: {labels: {app: search}}
      spec:
        terminationGracePeriodSeconds: 2
        nodeSelector: {disktype: ssd}
        containers:
          - name: search
            image: nginx:1.27-alpine
expect:
  - 'FailedScheduling'
  - "didn't match Pod's node affinity/selector"
