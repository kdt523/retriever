id: service-selector-mismatch
runbook: service-no-endpoints
description: Pods were relabelled app=orders-v2 but the Service still selects app=orders.
manifests: |
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: orders, labels: {app: orders-v2}}
  spec:
    replicas: 2
    selector: {matchLabels: {app: orders-v2}}
    template:
      metadata: {labels: {app: orders-v2}}
      spec:
        terminationGracePeriodSeconds: 2
        containers:
          - name: orders
            image: nginx:1.27-alpine
            ports: [{containerPort: 80}]
  ---
  apiVersion: v1
  kind: Service
  metadata: {name: orders}
  spec:
    selector: {app: orders}
    ports: [{port: 8000, targetPort: 80}]
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata: {name: gateway, labels: {app: gateway}}
  spec:
    replicas: 1
    selector: {matchLabels: {app: gateway}}
    template:
      metadata: {labels: {app: gateway}}
      spec:
        terminationGracePeriodSeconds: 2
        containers:
          - name: gateway
            image: python:3.12-alpine
            command: ["python", "-c"]
            args:
              - |
                import time, urllib.request
                while True:
                    try:
                        urllib.request.urlopen("http://orders:8000/", timeout=3)
                        print("GET http://orders:8000/ -> 200", flush=True)
                    except Exception as e:
                        print(f"ERROR GET http://orders:8000/ failed: {e!r}", flush=True)
                    time.sleep(3)
capture:
  - [get, endpointslices, -n, "{ns}", -l, kubernetes.io/service-name=orders, -o, wide]
  - [describe, service, orders, -n, "{ns}"]
  - [get, pods, -n, "{ns}", --show-labels]
expect:
  - 'ERROR GET http://orders:8000/ failed'
  - 'Connection refused'
